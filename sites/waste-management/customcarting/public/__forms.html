<!doctype html>
<html>
  <head><title>Netlify Forms</title></head>
  <body>
    <form name="request-pickup" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="request-pickup" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="address" />
      <select name="property-type">
        <option>Homeowner</option>
        <option>Seasonal Owner</option>
        <option>Rental Owner</option>
        <option>Property Manager</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
