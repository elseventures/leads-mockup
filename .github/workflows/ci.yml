name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install root tooling
        run: npm ci
      - name: Install site dependencies from registry
        run: npm run install:sites
      - name: Validate registry and path safety
        run: npm run check
      - name: Lint source projects
        run: npm run lint
      - name: Typecheck source projects
        run: npm run typecheck
      - name: Run source project tests
        run: npm test
      - name: Build all sites from registry
        run: npm run build
